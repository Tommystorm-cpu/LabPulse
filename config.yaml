# LabPulse starter configuration.
# On the Raspberry Pi, edit ~/labpulse-live/config.yaml.

mqtt:
  broker: mosquitto
  port: 1883

sms:
  # Keep enabled while testing so LabPulse does not contact the modem.
  dry_run: true
  recipients:
    - "+447700900000"
  test_recipients:
    - "+447700900001"

service_health:
  fault_confirm_seconds: 10
  recovery_confirm_seconds: 15

dashboards: {}

setups:
  compressed_air:
    label: Compressed Air
    icon: mdi:gauge
    order: 10
  pump_room_system:
    label: Pump Room Experiment
    icon: mdi:water-pump
    order: 20
  turbo_pump_experiment:
    label: Turbo Pump Experiment
    icon: mdi:snowflake-thermometer
    order: 30
  cryogenics_room:
    label: Cryogenics Room
    icon: mdi:home-thermometer-outline
    order: 40

services:
  pressure_monitor:
    label: Compressed Air and Environment Sensor Hub
    driver:
      type: labpulse.serial_pipe
      options:
        port: FAKE_PRESSURE_PORT
        baud_rate: 9600
    measurements:
      pressure:
        label: Pressure
        setups: [compressed_air]
        unit: bar
        device_class: pressure
      temperature:
        label: Main Lab Temperature
        group: Environment
        setups: [compressed_air]
        unit: "°C"
        device_class: temperature
      humidity:
        label: Main Lab Humidity
        group: Environment
        setups: [compressed_air]
        unit: "%"
        device_class: humidity

  pump_room:
    label: Pump Room Sensor Hub
    driver:
      type: labpulse.serial_pipe
      options:
        port: FAKE_PUMP_ROOM_PORT
        baud_rate: 9600
    measurements:
      flow1:
        label: Flow 1
        group: Flow
        setups: [pump_room_system]
        unit: L/min
        device_class: volume_flow_rate
      flow2:
        label: Flow 2
        group: Flow
        setups: [pump_room_system]
        unit: L/min
        device_class: volume_flow_rate
      temp0:
        label: Triton 1 Temperature 1
        group: Water Temperatures
        setups: [pump_room_system]
        unit: "°C"
        device_class: temperature
      temp1:
        label: Triton 1 Temperature 2
        group: Water Temperatures
        setups: [pump_room_system]
        unit: "°C"
        device_class: temperature
      temp2:
        label: Triton 2 Temperature 1
        group: Water Temperatures
        setups: [pump_room_system]
        unit: "°C"
        device_class: temperature
      temp3:
        label: Triton 2 Temperature 2
        group: Water Temperatures
        setups: [pump_room_system]
        unit: "°C"
        device_class: temperature
      press1:
        label: Pressure 1
        group: Pressure
        setups: [pump_room_system]
        unit: bar
        device_class: pressure
      press2:
        label: Pressure 2
        group: Pressure
        setups: [pump_room_system]
        unit: bar
        device_class: pressure
      roomtemp:
        label: Room Temperature
        group: Pump Room Environment Sensor
        setups: [pump_room_system]
        unit: "°C"
        device_class: temperature
      roomhum:
        label: Room Humidity
        group: Pump Room Environment Sensor
        setups: [pump_room_system]
        unit: "%"
        device_class: humidity

  turbo_pump:
    label: Turbo Pump Hub
    driver:
      type: labpulse.serial_pipe
      options:
        port: FAKE_TURBO_PUMP_PORT
        baud_rate: 9600
    measurements:
      flow1:
        label: Flow 1
        group: Flow
        setups: [turbo_pump_experiment]
        unit: L/min
        device_class: volume_flow_rate
      flow2:
        label: Flow 2
        group: Flow
        setups: [turbo_pump_experiment]
        unit: L/min
        device_class: volume_flow_rate
      temp0:
        label: Temperature 0
        group: Water Temperatures
        setups: [turbo_pump_experiment]
        unit: "°C"
        device_class: temperature
      temp1:
        label: Temperature 1
        group: Water Temperatures
        setups: [turbo_pump_experiment]
        unit: "°C"
        device_class: temperature
      temp2:
        label: Temperature 2
        group: Water Temperatures
        setups: [turbo_pump_experiment]
        unit: "°C"
        device_class: temperature
      temp3:
        label: Temperature 3
        group: Water Temperatures
        setups: [turbo_pump_experiment]
        unit: "°C"
        device_class: temperature

  room_environment:
    label: Cryogenics Room Environment Sensor
    driver:
      type: labpulse.sht40
      options:
        bus: 1
        address: 0x44
    measurements:
      temperature:
        label: Room Temperature
        setups: [cryogenics_room]
        unit: "°C"
        device_class: temperature
      humidity:
        label: Room Humidity
        setups: [cryogenics_room]
        unit: "%"
        device_class: humidity
    read_interval_seconds: 2

  ups_monitor:
    label: UPS Monitor
    driver:
      type: labpulse.x1200
      options:
        bus: 1
        address: 0x36
        gpio_chip: /dev/gpiochip0
        gpio_line: 6
        mains_present_active_high: true
    measurements:
      voltage:
        label: UPS Battery Voltage
        unit: V
        device_class: voltage
      battery_level:
        label: UPS Battery Level
        unit: "%"
        device_class: battery
      mains_present:
        label: External Power Present
        state_class: null
    read_interval_seconds: 1
    maximum_measurement_age_seconds: 15
    power_detection:
      outage_confirm_seconds: 3
      restore_confirm_seconds: 5

custom_measurements: {}
